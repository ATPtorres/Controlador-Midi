name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :midi:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MIDI-Performance-Controller-Pro.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MIDI-Performance-Controller-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Performance-Controller-Pro
          path: MIDI-Performance-Controller-Pro.apk
          if-no-files-found: error
