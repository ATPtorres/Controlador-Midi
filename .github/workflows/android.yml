name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify Gradle 8.9
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gradle-8.9-bin.zip"
          checksum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
          for url in \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip; do
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 1 --max-time 80 "$url" --output "$archive" &&
                printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check; then
              unzip -q "$archive" -d "$RUNNER_TEMP"
              echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1
      - name: Test desktop MIDI bridge
        run: python3 -m unittest discover -s desktop -v
      - name: Build standalone release APK
        run: gradle --no-daemon -PstandaloneApk=true :midi:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease
      - name: Sign and verify release APK
        run: |
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -keystore "$RUNNER_TEMP/midi-test.p12" -storetype PKCS12 \
            -storepass android-test -alias midi-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MIDI Performance Controller Pro Android Testing"
          "$sdk/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/midi-aligned.apk"
          "$sdk/apksigner" sign --ks "$RUNNER_TEMP/midi-test.p12" --ks-pass pass:android-test \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out MIDI-Performance-Controller-Pro-v1.2.0.apk "$RUNNER_TEMP/midi-aligned.apk"
          "$sdk/apksigner" verify --min-sdk-version 33 --verbose MIDI-Performance-Controller-Pro-v1.2.0.apk
          "$sdk/zipalign" -c -P 16 4 MIDI-Performance-Controller-Pro-v1.2.0.apk
          badging="$("$sdk/aapt" dump badging MIDI-Performance-Controller-Pro-v1.2.0.apk)"
          grep -F "package: name='com.alemnt.midipro.transport' versionCode='5'" <<< "$badging"
          grep -Fx "sdkVersion:'33'" <<< "$badging"
          grep -F "'arm64-v8a'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then exit 1; fi
      - name: Enable emulator hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
      - name: Install and launch the delivered APK on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/check-android-install.sh MIDI-Performance-Controller-Pro-v1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Performance-Controller-Pro-v1.2.0
          path: |
            MIDI-Performance-Controller-Pro-v1.2.0.apk
            desktop/MIDI-Performance-Waveform.trkctrlr
          if-no-files-found: error
